networks:
  expense: {}
volumes:
  mysql:
# docker run -d --name mysql --network expense -v mysql:/var/lib/mysql mysql:1.0.0
services:
  mysql:
    image: mysql:1.0.0
    container_name: mysql
    networks:
      - expense
    volumes:
      - mysql:/var/lib/mysql
  backend:
    image: backend:1.0.0
    container_name: backend
    networks:
      - expense
    depends_on:
    - mysql
  frontend:
    image: frontend:1.0.0
    container_name: frontend
    ports:
    - 80:80
    networks:
      - expense
    depends_on:
    - backend
